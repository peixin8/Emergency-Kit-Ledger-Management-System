services:
  mysql:
    image: mysql:8.4
    container_name: emergency-ledger-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: emergency_ledger
      MYSQL_USER: emergency_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment or .env file}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - emergency_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u emergency_app -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  emergency_mysql_data:
