server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/emergency_ledger?useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:emergency}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
app:
  geocoding:
    base-url: ${GEOCODING_BASE_URL:https://restapi.amap.com}
    key: ${AMAP_WEB_SERVICE_KEY:}
    min-interval-ms: ${GEOCODING_MIN_INTERVAL_MS:1000}
  token-secret: ${APP_TOKEN_SECRET:}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:}
    organization-name: ${APP_ORGANIZATION_NAME:默认组织}
